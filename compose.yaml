name: nike-mp

x-api-env: &api-env
  NIKE_MP_DATABASE_URL: postgresql+psycopg://nike_mp:nike_mp@db:5432/nike_mp
  NIKE_MP_CREDENTIAL_KEY: ${NIKE_MP_CREDENTIAL_KEY:-}
  # 可选：把 .env 里的值透传给 api/worker/scheduler（未设置时保持默认）。
  NIKE_MP_NIKE_PHONE_AUTH_ENABLED: ${NIKE_MP_NIKE_PHONE_AUTH_ENABLED:-false}
  NIKE_MP_NIKE_PHONE_AUTH_CONTRACT_VERSION: ${NIKE_MP_NIKE_PHONE_AUTH_CONTRACT_VERSION:-}
  NIKE_MP_DINGTALK_BOT_ENABLED: ${NIKE_MP_DINGTALK_BOT_ENABLED:-false}
  NIKE_MP_DINGTALK_BOT_CLIENT_ID: ${NIKE_MP_DINGTALK_BOT_CLIENT_ID:-}
  NIKE_MP_DINGTALK_BOT_CLIENT_SECRET: ${NIKE_MP_DINGTALK_BOT_CLIENT_SECRET:-}
  NIKE_MP_DINGTALK_LINK_CODE_TTL_SECONDS: ${NIKE_MP_DINGTALK_LINK_CODE_TTL_SECONDS:-900}
  NIKE_MP_PUBLIC_BASE_URL: ${NIKE_MP_PUBLIC_BASE_URL:-http://127.0.0.1:15173}
  NIKE_MP_COOKIE_SECURE: ${NIKE_MP_COOKIE_SECURE:-false}
  TZ: Asia/Shanghai

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nike_mp
      POSTGRES_USER: nike_mp
      POSTGRES_PASSWORD: nike_mp
      TZ: Asia/Shanghai
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nike_mp -d nike_mp"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: ./apps/api
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy
    command: alembic upgrade head
    restart: "no"

  api:
    build:
      context: ./apps/api
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      # 只绑本机：对外统一由反向代理（HTTPS）进入，避免绕过 TLS/安全头。
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  worker:
    build:
      context: ./apps/api
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: python -m app.worker
    restart: unless-stopped

  scheduler:
    build:
      context: ./apps/api
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: python -m app.scheduler_main
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
    environment:
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
      VITE_API_TARGET: ${VITE_API_TARGET:-http://api:8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      # 只绑本机：对外统一由反向代理（HTTPS）进入，避免绕过 TLS/安全头。
      - "127.0.0.1:5173:5173"
    restart: unless-stopped

volumes:
  db-data:

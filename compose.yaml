name: nike-mp

#: 容器日志封顶：worker 会按请求写 INFO 行（实测单体 300MB+）。默认 json-file 不轮转，
#: 曾经把 40G 盘写满 → Postgres 写不了锁文件 → 全站登录 500。每个服务最多 3×20MB。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

x-api-env: &api-env
  NIKE_MP_DATABASE_URL: postgresql+psycopg://nike_mp:nike_mp@db:5432/nike_mp
  NIKE_MP_CREDENTIAL_KEY: ${NIKE_MP_CREDENTIAL_KEY:-}
  # 405 挑战风暴熔断：一轮里 3 家门店被挑战打满重试即整轮冷却并补跑（0=关闭）。
  NIKE_MP_WAF_STORM_STORE_LIMIT: ${NIKE_MP_WAF_STORM_STORE_LIMIT:-3}
  # 门店级并发：被 WAF 拦掉的尝试互相重叠，墙钟不再按"被拦次数×退避"线性累加。
  NIKE_MP_STORE_CONCURRENCY: ${NIKE_MP_STORE_CONCURRENCY:-4}
  # 405 挑战的独立重试预算（只影响被拦的请求，正常请求不受影响）。
  NIKE_MP_WAF_RETRY_LIMIT: ${NIKE_MP_WAF_RETRY_LIMIT:-12}
  # 405 挑战的近即时重试间隔（实测退避不提高通过率、只加时延：0.43s vs 1.00s）。
  NIKE_MP_WAF_RETRY_DELAY_SECONDS: ${NIKE_MP_WAF_RETRY_DELAY_SECONDS:-0.2}
  # 吞吐闸门：小时闸按「尝试」计次（含每次重试），要万级/小时必须同时放开小时闸与日预算。
  NIKE_MP_QUOTA_HOURLY_CAP: ${NIKE_MP_QUOTA_HOURLY_CAP:-900}
  NIKE_MP_QUOTA_HOURLY_SLOW_LINE: ${NIKE_MP_QUOTA_HOURLY_SLOW_LINE:-600}
  NIKE_MP_DAILY_REVIEW_BUDGET: ${NIKE_MP_DAILY_REVIEW_BUDGET:-60000}
  # 出口池：代理列表（JSON 数组）与列表文件（容器内路径，热重载）；空=直连。
  NIKE_MP_PROXY_URLS: ${NIKE_MP_PROXY_URLS:-[]}
  NIKE_MP_PROXY_URLS_FILE: ${NIKE_MP_PROXY_URLS_FILE:-}
  NIKE_MP_PROXY_COOLDOWN_SECONDS: ${NIKE_MP_PROXY_COOLDOWN_SECONDS:-120}
  NIKE_MP_FINGERPRINT_ROTATION: ${NIKE_MP_FINGERPRINT_ROTATION:-true}
  # 可选：把 .env 里的值透传给 api/worker/scheduler（未设置时保持默认）。
  NIKE_MP_NIKE_PHONE_AUTH_ENABLED: ${NIKE_MP_NIKE_PHONE_AUTH_ENABLED:-false}
  NIKE_MP_NIKE_PHONE_AUTH_CONTRACT_VERSION: ${NIKE_MP_NIKE_PHONE_AUTH_CONTRACT_VERSION:-}
  NIKE_MP_DINGTALK_BOT_ENABLED: ${NIKE_MP_DINGTALK_BOT_ENABLED:-false}
  NIKE_MP_DINGTALK_BOT_CLIENT_ID: ${NIKE_MP_DINGTALK_BOT_CLIENT_ID:-}
  NIKE_MP_DINGTALK_BOT_CLIENT_SECRET: ${NIKE_MP_DINGTALK_BOT_CLIENT_SECRET:-}
  NIKE_MP_DINGTALK_LINK_CODE_TTL_SECONDS: ${NIKE_MP_DINGTALK_LINK_CODE_TTL_SECONDS:-900}
  NIKE_MP_PUBLIC_BASE_URL: ${NIKE_MP_PUBLIC_BASE_URL:-http://127.0.0.1:15173}
  NIKE_MP_COOKIE_SECURE: ${NIKE_MP_COOKIE_SECURE:-false}
  TZ: Asia/Shanghai

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nike_mp
      POSTGRES_USER: nike_mp
      POSTGRES_PASSWORD: nike_mp
      TZ: Asia/Shanghai
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nike_mp -d nike_mp"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging
    restart: unless-stopped

  migrate:
    build:
      context: ./apps/api
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy
    command: alembic upgrade head
    logging: *default-logging
    restart: "no"

  api:
    build:
      context: ./apps/api
    environment: *api-env
    volumes:
      # 出口池列表（与 worker 共用同一份 runtime 目录）
      - ./runtime:/data
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      # 只绑本机：对外统一由反向代理（HTTPS）进入，避免绕过 TLS/安全头。
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    logging: *default-logging
    restart: unless-stopped

  worker:
    build:
      context: ./apps/api
    environment: *api-env
    volumes:
      # 出口池列表（宿主 ./runtime/proxies.txt 由抓取器定时刷新，容器内热重载）
      - ./runtime:/data:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: python -m app.worker
    logging: *default-logging
    restart: unless-stopped

  scheduler:
    build:
      context: ./apps/api
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: python -m app.scheduler_main
    logging: *default-logging
    restart: unless-stopped

  # 独立的调度监控：核对实例心跳与迟到任务，只告警与提供运维接口，不派发不执行。
  monitor:
    build:
      context: ./apps/api
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: python -m app.monitor_main
    logging: *default-logging
    restart: unless-stopped

  proxy-refresh:
    build:
      context: ./apps/api
    environment:
      # 付费动态代理（1024proxy whitelist 模式）：端点短命，所以高频小批量刷新。
      PAID_PROXY_NUM: ${PAID_PROXY_NUM:-200}
      PAID_PROXY_TTL: ${PAID_PROXY_TTL:-10}
      PAID_PROXY_REGION: ${PAID_PROXY_REGION:-Rand}
      PROXY_REFRESH_SECONDS: ${PROXY_REFRESH_SECONDS:-45}
    volumes:
      # 定时重建出口池（qa/ 只读挂载，runtime 目录与 worker 共享）
      - ./qa:/qa:ro
      - ./runtime:/data
    command: ["sh", "-c", "while true; do python /qa/fetch_paid_proxies.py > /data/proxies.txt.tmp 2>>/data/fetch.log && [ -s /data/proxies.txt.tmp ] && mv /data/proxies.txt.tmp /data/proxies.txt; sleep $${PROXY_REFRESH_SECONDS:-45}; done"]
    logging: *default-logging
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
    environment:
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
      VITE_API_TARGET: ${VITE_API_TARGET:-http://api:8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      # 只绑本机：对外统一由反向代理（HTTPS）进入，避免绕过 TLS/安全头。
      - "127.0.0.1:5173:5173"
    logging: *default-logging
    restart: unless-stopped

volumes:
  db-data:

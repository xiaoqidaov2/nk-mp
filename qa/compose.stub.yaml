# 离线 stub 叠加（bridge 网络变体）：Nike 上游切回本地假服务。
#
#   docker compose -p nike-mp-auth-qa -f qa/compose.auth.yaml \
#     -f qa/compose.stub.yaml up -d
name: nike-mp-auth-qa

x-stub-env: &stub-env
  NIKE_MP_NIKE_API_BASE: ${QA_STUB_BASE:-http://stub:9100}
  NIKE_MP_NIKE_TEST_API_BASE: ${QA_STUB_BASE:-http://stub:9100}
  NIKE_MP_NIKE_OAUTH_BASE: ${QA_STUB_BASE:-http://stub:9100}
  NIKE_MP_REVIEW_POLL_TRIES: "2"
  NIKE_MP_REVIEW_POLL_INTERVAL_SECONDS: "0.2"
  NIKE_MP_PUSH_ALLOW_PRIVATE_TARGETS: "true"
  # 离线冒烟要快速走到"冷却结束自动补跑"：阶梯 30 秒、补跑延迟 5 秒、重试上限 2 次。
  NIKE_MP_REQUEST_RETRY_LIMIT: "2"
  NIKE_MP_THROTTLE_BACKOFF_SECONDS: ${QA_THROTTLE_BACKOFF_SECONDS:-30}
  NIKE_MP_JOB_RETRY_DELAY_SECONDS: ${QA_JOB_RETRY_DELAY_SECONDS:-5}

services:
  api:
    environment: *stub-env
  worker:
    environment: *stub-env
  scheduler:
    environment: *stub-env

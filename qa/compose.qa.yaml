# QA overlay: isolated project + offline upstream stub.
#
#   docker compose -p nike-mp-qa -f compose.yaml -f qa/compose.qa.yaml up -d --build
#
# The stub replaces every Nike endpoint; nothing in this project ever reaches
# the real service. The volume is project-scoped, so `-p nike-mp-qa` gives an
# independent database that never mixes with development data.

x-qa-upstream-env: &qa-upstream-env
  NIKE_MP_NIKE_API_BASE: http://stub:9100
  NIKE_MP_NIKE_TEST_API_BASE: http://stub:9100
  NIKE_MP_NIKE_OAUTH_BASE: http://stub:9100
  # Self-service phone binding, pointed at the same stub. The contract version
  # must equal SUPPORTED_CONTRACT_VERSION in app/nike/phone_auth.py.
  NIKE_MP_CREDENTIAL_KEY: ${NIKE_MP_CREDENTIAL_KEY:-qa-credential-key}
  NIKE_MP_NIKE_PHONE_AUTH_ENABLED: "true"
  NIKE_MP_NIKE_PHONE_AUTH_CONTRACT_VERSION: "2026-09-29/mp-phone-otc-pkce"
  # 离线冒烟追求速度：重试上限、风控阶梯、补跑延迟都按秒级设置。
  NIKE_MP_REQUEST_RETRY_LIMIT: "2"
  NIKE_MP_REVIEW_POLL_TRIES: "2"
  NIKE_MP_REVIEW_POLL_INTERVAL_SECONDS: "0.2"
  NIKE_MP_THROTTLE_BACKOFF_SECONDS: ${QA_THROTTLE_BACKOFF_SECONDS:-30}
  NIKE_MP_JOB_RETRY_DELAY_SECONDS: ${QA_JOB_RETRY_DELAY_SECONDS:-5}
  NIKE_MP_QUOTA_HOURLY_CAP: ${QA_QUOTA_HOURLY_CAP:-900}
  # 冒烟把推送指向容器内的 stub（json://stub:9100 或回环地址），
  # 默认的 SSRF 保护会拒绝内网目标，这里显式放开。
  NIKE_MP_PUSH_ALLOW_PRIVATE_TARGETS: "true"

services:
  stub:
    build:
      context: ./qa
      dockerfile: Dockerfile.stub
    ports:
      - "9100:9100"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:9100/healthz')\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    environment:
      <<: *qa-upstream-env
    depends_on:
      stub:
        condition: service_healthy

  worker:
    environment:
      <<: *qa-upstream-env
      NIKE_MP_WORKER_POLL_SECONDS: "1"
      NIKE_MP_WORKER_LEASE_SECONDS: "60"
    depends_on:
      stub:
        condition: service_healthy

  scheduler:
    environment:
      <<: *qa-upstream-env
      NIKE_MP_SCHEDULER_INTERVAL_SECONDS: "5"
    depends_on:
      stub:
        condition: service_healthy

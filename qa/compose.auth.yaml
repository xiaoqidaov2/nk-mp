# Self-contained QA stack for the self-service phone-binding acceptance loop.
#
#   docker compose -p nike-mp-auth-qa -f qa/compose.auth.yaml up -d --build
#   docker compose -p nike-mp-auth-qa -f qa/compose.auth.yaml \
#     exec -T api python - < qa/seed_qa.py
#   QA_API=http://127.0.0.1:18000 QA_STUB=http://127.0.0.1:19100 \
#     apps/api/.venv/bin/python qa/smoke.py
#
# Unlike qa/compose.qa.yaml this file is *self-contained* (no root compose.yaml
# overlay) and turns the phone-auth contract on, pointing every Nike host at
# the offline stub. Ports and the credential key come from the environment:
#
#   QA_API_PORT   (default 18000)   API host port
#   QA_WEB_PORT   (default 15173)   web host port
#   QA_STUB_PORT  (default 19100)   stub host port
#   QA_CREDENTIAL_KEY (default fake)  credential encryption key
#
# If 18000/15173/19100 are taken, export 28000/25173/29100 (see qa/README.md)
# or any free ports. Nothing here ever reaches the real Nike service.

name: nike-mp-auth-qa

x-auth-env: &auth-env
  NIKE_MP_DATABASE_URL: postgresql+psycopg://nike_mp:nike_mp@db:5432/nike_mp
  NIKE_MP_CREDENTIAL_KEY: ${QA_CREDENTIAL_KEY:-qa-auth-fake-credential-key}
  # 默认接真实 Nike 接口；离线 smoke 用 -f qa/compose.stub.yaml 叠加回 stub。
  NIKE_MP_NIKE_API_BASE: ${QA_NIKE_API_BASE:-https://api.nike.com.cn}
  NIKE_MP_NIKE_TEST_API_BASE: ${QA_NIKE_TEST_API_BASE:-https://api-test.nike.com.cn}
  NIKE_MP_NIKE_OAUTH_BASE: ${QA_NIKE_OAUTH_BASE:-https://accounts.nike.com.cn}
  NIKE_MP_NIKE_PHONE_AUTH_ENABLED: "true"
  NIKE_MP_NIKE_PHONE_AUTH_CONTRACT_VERSION: "2026-09-29/mp-phone-otc-pkce"
  # 额度冷却闭环要显式压低闸值（如 QA_QUOTA_HOURLY_CAP=2）；默认与生产一致。
  NIKE_MP_QUOTA_HOURLY_CAP: ${QA_QUOTA_HOURLY_CAP:-900}
  TZ: Asia/Shanghai

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nike_mp
      POSTGRES_USER: nike_mp
      POSTGRES_PASSWORD: nike_mp
      TZ: Asia/Shanghai
    volumes:
      - auth-qa-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nike_mp -d nike_mp"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  stub:
    build:
      context: .
      dockerfile: Dockerfile.stub
    environment:
      STUB_PORT: "9100"
    ports:
      - "${QA_STUB_PORT:-19100}:9100"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:9100/healthz')\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: ../apps/api
    environment: *auth-env
    depends_on:
      db:
        condition: service_healthy
    command: alembic upgrade head
    restart: "no"

  api:
    build:
      context: ../apps/api
    environment: *auth-env
    depends_on:
      db:
        condition: service_healthy
      stub:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${QA_API_PORT:-18000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  worker:
    build:
      context: ../apps/api
    environment:
      <<: *auth-env
      NIKE_MP_WORKER_POLL_SECONDS: "1"
      NIKE_MP_WORKER_LEASE_SECONDS: "60"
    depends_on:
      db:
        condition: service_healthy
      stub:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: python -m app.worker
    restart: unless-stopped

  scheduler:
    build:
      context: ../apps/api
    environment:
      <<: *auth-env
      NIKE_MP_SCHEDULER_INTERVAL_SECONDS: "5"
    depends_on:
      db:
        condition: service_healthy
      stub:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: python -m app.scheduler_main
    restart: unless-stopped

  web:
    build:
      context: ../apps/web
    environment:
      VITE_API_TARGET: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${QA_WEB_PORT:-15173}:5173"
    restart: unless-stopped

volumes:
  auth-qa-db-data:
